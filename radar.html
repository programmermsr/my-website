  <script>
    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const mainEl = document.getElementById('main-area');
    const scoreEl = document.getElementById('score');
    const activeEl = document.getElementById('active');
    const escapedEl = document.getElementById('escaped');

    let W = 0, H = 0, CX = 0, CY = 0, R = 0;
    let sweepAngle = 0;
    let lastSpawn = 0;
    let score = 0;
    let escaped = 0;

    const targets = [];
    const missiles = [];
    const explosions = [];

    const SPAWN_INTERVAL = 2200;
    const MAX_TARGETS = 6;
    const TARGET_RADIUS = 30;

    const AIRCRAFT_TYPES = ['f35', 'f16', 'b2', 'drone'];

    const TYPE_SPEED = {
      f35:  [0.40, 0.60],
      f16:  [0.45, 0.65],
      b2:   [0.30, 0.45],
      drone:[0.35, 0.50]
    };

    function resize() {
      const rect = mainEl.getBoundingClientRect();
      const isSmall = window.innerWidth < 600;
      const padding = isSmall ? 30 : 50;
      const size = Math.max(200, Math.min(rect.width, rect.height) - padding * 2);

      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const oldCX = CX, oldCY = CY, oldR = R;
      W = size;
      H = size;
      CX = W / 2;
      CY = H / 2;
      R = Math.min(W, H) * 0.46;

      if (oldR > 0) {
        const scale = R / oldR;
        for (const t of targets) {
          t.x = CX + (t.x - oldCX) * scale;
          t.y = CY + (t.y - oldCY) * scale;
        }
      }
    }

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement ||
             document.mozFullScreenElement || document.msFullscreenElement;
    }
    function enterFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
      if (el.msRequestFullscreen) return el.msRequestFullscreen();
    }
    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!getFullscreenElement()) enterFullscreen(mainEl).catch(err => console.error(err));
      else exitFullscreen();
    });

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => {
        requestAnimationFrame(() => {
          requestAnimationFrame(resize);
        });
        setTimeout(resize, 200);
      });
    });

    window.addEventListener('resize', resize);

    function spawnTarget() {
      const type = AIRCRAFT_TYPES[Math.floor(Math.random() * AIRCRAFT_TYPES.length)];
      const entryAngle = Math.random() * Math.PI * 2;
      const exitAngle = entryAngle + Math.PI + (Math.random() - 0.5) * 0.6;

      const startDist = R * 1.02;
      const x = CX + Math.cos(entryAngle) * startDist;
      const y = CY + Math.sin(entryAngle) * startDist;

      const endDist = R * 1.15;
      const targetX = CX + Math.cos(exitAngle) * endDist;
      const targetY = CY + Math.sin(exitAngle) * endDist;

      const dx = targetX - x;
      const dy = targetY - y;
      const d = Math.hypot(dx, dy);
      const [sMin, sMax] = TYPE_SPEED[type];
      const speed = sMin + Math.random() * (sMax - sMin);

      targets.push({
        x, y,
        type,
        rot: Math.atan2(dx, -dy),
        vx: (dx / d) * speed,
        vy: (dy / d) * speed,
        hit: false,
        seed: Math.random() * 100
      });
    }

    function createExplosion(x, y) {
      const particles = [];
      const count = 24;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.3;
        const speed = 2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          life: 1
        });
      }
      explosions.push({ x, y, radius: 5, particles, life: 1 });
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      let best = null;
      let bestD = TARGET_RADIUS;
      for (const t of targets) {
        if (t.hit) continue;
        const d = Math.hypot(t.x - x, t.y - y);
        if (d < bestD) { bestD = d; best = t; }
      }

      if (best) {
        best.hit = true;
        missiles.push({
          x: CX, y: CY,
          target: best,
          speed: 7,
          trail: []
        });
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      let hover = false;
      for (const t of targets) {
        if (t.hit) continue;
        if (Math.hypot(t.x - x, t.y - y) < TARGET_RADIUS) { hover = true; break; }
      }
      canvas.style.cursor = hover ? 'pointer' : 'crosshair';
    });

    function drawRadarGrid() {
      ctx.save();

      const grad = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R);
      grad.addColorStop(0, 'rgba(0, 50, 25, 0.9)');
      grad.addColorStop(1, 'rgba(2, 16, 8, 1)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(0, 255, 100, 0.15)';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(CX, CY, R * (i / 4), 0, Math.PI * 2);
        ctx.stroke();
      }

      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(0, 255, 100, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY);
      ctx.moveTo(CX, CY - R); ctx.lineTo(CX, CY + R);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 255, 100, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#00ff64';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#00ff64';
      ctx.beginPath();
      ctx.arc(CX, CY, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    function drawSweep() {
      const trailLength = 90;
      for (let i = 0; i < trailLength; i++) {
        const a = sweepAngle - i * 0.014;
        const alpha = (1 - i / trailLength) * 0.35;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
        ctx.strokeStyle = `rgba(0, 255, 100, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX + Math.cos(sweepAngle) * R, CY + Math.sin(sweepAngle) * R);
      ctx.strokeStyle = 'rgba(0, 255, 100, 0.9)';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00ff64';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawF35() {
      ctx.beginPath();
      ctx.moveTo(0, -13);
      ctx.bezierCurveTo(1.2, -11, 1.8, -8, 2.2, -5);
      ctx.lineTo(2.6, 1);
      ctx.lineTo(7, 5);
      ctx.lineTo(12, 9);
      ctx.lineTo(12.5, 11);
      ctx.lineTo(3.2, 10);
      ctx.lineTo(2.8, 13);
      ctx.lineTo(-2.8, 13);
      ctx.lineTo(-3.2, 10);
      ctx.lineTo(-12.5, 11);
      ctx.lineTo(-12, 9);
      ctx.lineTo(-7, 5);
      ctx.lineTo(-2.6, 1);
      ctx.lineTo(-2.2, -5);
      ctx.bezierCurveTo(-1.8, -8, -1.2, -11, 0, -13);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -5.5, 1.6, 3.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 180, 180, 0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 120, 120, 0.9)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 60, 60, 0.95)';
      ctx.strokeStyle = '#ff3c3c';
      ctx.lineWidth = 1.2;

      ctx.beginPath();
      ctx.moveTo(-6, 11);
      ctx.lineTo(-7.5, 15.5);
      ctx.lineTo(-4.5, 15.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(6, 11);
      ctx.lineTo(7.5, 15.5);
      ctx.lineTo(4.5, 15.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawF16() {
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(1.4, -9);
      ctx.lineTo(2, -3);
      ctx.lineTo(2.4, 2);
      ctx.lineTo(12, 6);
      ctx.lineTo(12, 8);
      ctx.lineTo(2.5, 7);
      ctx.lineTo(5, 10.5);
      ctx.lineTo(5, 11.5);
      ctx.lineTo(1.6, 10.5);
      ctx.lineTo(1.6, 13);
      ctx.lineTo(0, 12);
      ctx.lineTo(-1.6, 13);
      ctx.lineTo(-1.6, 10.5);
      ctx.lineTo(-5, 11.5);
      ctx.lineTo(-5, 10.5);
      ctx.lineTo(-2.5, 7);
      ctx.lineTo(-12, 8);
      ctx.lineTo(-12, 6);
      ctx.lineTo(-2.4, 2);
      ctx.lineTo(-2, -3);
      ctx.lineTo(-1.4, -9);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -5.5, 1.4, 3, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 180, 180, 0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 120, 120, 0.9)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 60, 60, 0.95)';
      ctx.strokeStyle = '#ff3c3c';
      ctx.lineWidth = 1.2;
    }

    function drawB2() {
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.lineTo(3, -5);
      ctx.lineTo(16, 5);
      ctx.lineTo(15, 8);
      ctx.lineTo(8, 8);
      ctx.lineTo(4, 12);
      ctx.lineTo(0, 8);
      ctx.lineTo(-4, 12);
      ctx.lineTo(-8, 8);
      ctx.lineTo(-15, 8);
      ctx.lineTo(-16, 5);
      ctx.lineTo(-3, -5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -3, 1.4, 2.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 180, 180, 0.5)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 120, 120, 0.9)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 60, 60, 0.95)';
      ctx.strokeStyle = '#ff3c3c';
      ctx.lineWidth = 1.2;
    }

    function drawDrone() {
      ctx.beginPath();
      ctx.moveTo(-2, -3);
      ctx.lineTo(-18, -1.5);
      ctx.lineTo(-18, 1);
      ctx.lineTo(-2, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(2, -3);
      ctx.lineTo(18, -1.5);
      ctx.lineTo(18, 1);
      ctx.lineTo(2, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -1, 2.4, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-6, 14);
      ctx.lineTo(-4, 15);
      ctx.lineTo(0, 11);
      ctx.lineTo(4, 15);
      ctx.lineTo(6, 14);
      ctx.lineTo(1.5, 8);
      ctx.lineTo(-1.5, 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-3, 15.5);
      ctx.lineTo(3, 15.5);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.lineWidth = 1.2;

      ctx.beginPath();
      ctx.ellipse(0, -7, 1.3, 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 180, 180, 0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 120, 120, 0.9)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 60, 60, 0.95)';
      ctx.strokeStyle = '#ff3c3c';
      ctx.lineWidth = 1.2;
    }

    const DRAW_FNS = {
      f35: drawF35,
      f16: drawF16,
      b2: drawB2,
      drone: drawDrone
    };

    function drawTarget(t) {
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(t.rot);

      const pulse = 0.7 + Math.sin(performance.now() / 180 + t.seed) * 0.3;

      ctx.shadowBlur = 14 * pulse;
      ctx.shadowColor = `rgba(255, 60, 60, ${pulse})`;
      ctx.strokeStyle = '#ff3c3c';
      ctx.fillStyle = 'rgba(255, 60, 60, 0.95)';
      ctx.lineWidth = 1.2;

      DRAW_FNS[t.type]();

      if (t.hit) {
        ctx.rotate(-t.rot);
        ctx.strokeStyle = '#00ff64';
        ctx.shadowColor = '#00ff64';
        ctx.shadowBlur = 10;
        ctx.lineWidth = 1.8;
        const s = 18 + Math.sin(performance.now() / 90) * 2;
        ctx.beginPath();
        ctx.moveTo(-s, -s + 6); ctx.lineTo(-s, -s); ctx.lineTo(-s + 6, -s);
        ctx.moveTo(s - 6, -s); ctx.lineTo(s, -s); ctx.lineTo(s, -s + 6);
        ctx.moveTo(s, s - 6); ctx.lineTo(s, s); ctx.lineTo(s - 6, s);
        ctx.moveTo(-s + 6, s); ctx.lineTo(-s, s); ctx.lineTo(-s, s - 6);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawMissile(m) {
      for (let i = 0; i < m.trail.length; i++) {
        const p = m.trail[i];
        const alpha = (i / m.trail.length) * 0.7;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 255, 100, ${alpha})`;
        ctx.fill();
      }

      const angle = Math.atan2(m.target.y - m.y, m.target.x - m.x);
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(angle);
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#00ff64';
      ctx.fillStyle = '#00ff64';
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-4, -4);
      ctx.lineTo(-4, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawExplosion(e) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 200, 50, ${e.life})`;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#ffaa00';
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 150, 0, ${e.life * 0.5})`;
      ctx.fill();

      for (const p of e.particles) {
        if (p.life <= 0) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${150 + p.life * 100}, 30, ${p.life})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffaa00';
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function update(t) {
      if (t - lastSpawn > SPAWN_INTERVAL && targets.length < MAX_TARGETS) {
        spawnTarget();
        lastSpawn = t;
      }

      for (let i = targets.length - 1; i >= 0; i--) {
        const tgt = targets[i];
        tgt.x += tgt.vx;
        tgt.y += tgt.vy;

        const dx = tgt.x - CX;
        const dy = tgt.y - CY;
        const d = Math.hypot(dx, dy);

        if (!tgt.hit && d > R * 1.1) {
          targets.splice(i, 1);
          escaped++;
          escapedEl.textContent = escaped;
        }
      }

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        if (!m.target || targets.indexOf(m.target) === -1) {
          missiles.splice(i, 1);
          continue;
        }

        m.trail.push({ x: m.x, y: m.y });
        if (m.trail.length > 22) m.trail.shift();

        const dx = m.target.x - m.x;
        const dy = m.target.y - m.y;
        const d = Math.hypot(dx, dy);

        if (d < 14) {
          createExplosion(m.target.x, m.target.y);
          const idx = targets.indexOf(m.target);
          if (idx > -1) targets.splice(idx, 1);
          score++;
          scoreEl.textContent = score;
          missiles.splice(i, 1);
        } else {
          m.x += (dx / d) * m.speed;
          m.y += (dy / d) * m.speed;
        }
      }

      for (let i = explosions.length - 1; i >= 0; i--) {
        const e = explosions[i];
        e.life -= 0.025;
        e.radius += 3.5;
        for (const p of e.particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life -= 0.03;
        }
        if (e.life <= 0) explosions.splice(i, 1);
      }

      activeEl.textContent = targets.length;
    }

    function render() {
      ctx.fillStyle = 'rgba(2, 16, 8, 1)';
      ctx.fillRect(0, 0, W, H);

      drawRadarGrid();
      drawSweep();

      for (const t of targets) drawTarget(t);
      for (const m of missiles) drawMissile(m);
      for (const e of explosions) drawExplosion(e);
    }

    let last = 0;
    function loop(t) {
      if (!last) last = t;
      const dt = t - last;
      last = t;

      sweepAngle += 0.018 * Math.min(dt / 16, 3);
      if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;

      update(t);
      render();
      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
