<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زمان استراحت | محمد صادق رضائی</title>
  <meta name="description" content="صفحه استراحت با ساعت عقربه‌ای تهران و شمارنده زمان استراحت">
  
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  
  <link rel="icon" href="homeImages/head/msrMedium.jpg" type="image/jpeg">
  <link rel="shortcut icon" href="homeImages/head/msrMedium.jpg">
  <link rel="apple-touch-icon" href="homeImages/head/msrMedium.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      user-select: none;
    }

    body {
      background: #1a2e1a;
      color: #e0e0e0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #142414;
      border-bottom: 2px solid #2e5e2e;
      flex-shrink: 0;
      min-height: 58px;
    }

    .top-bar h2 {
      color: #7fd77f;
      font-size: 16px;
      font-weight: bold;
    }

    .brand-link {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #7fd77f;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(127, 215, 127, 0.5);
      transition: 0.3s;
      direction: ltr;
    }

    .brand-link:hover {
      color: #fff;
      text-shadow: 0 0 30px rgba(127, 215, 127, 0.9);
    }

    /* ===== دکمه‌های سمت چپ نوار بالا ===== */
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn,
    .fs-btn {
      color: #7fd77f;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid #7fd77f;
      border-radius: 4px;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      line-height: 1;
      /* ارتفاع یکسان برای هر دو دکمه */
      height: 34px;
      padding-top: 0;
      padding-bottom: 0;
    }

    .back-btn {
      padding-right: 14px;
      padding-left: 14px;
    }

    .fs-btn {
      width: 34px;
      padding-right: 0;
      padding-left: 0;
      flex-shrink: 0;
    }

    .back-btn:hover,
    .fs-btn:hover {
      background: #7fd77f;
      color: #142414;
    }

    /* آیکون‌های تمام‌صفحه */
    .fs-btn .icon-collapse { display: none; }
    body.fs-active .fs-btn .icon-expand { display: none; }
    body.fs-active .fs-btn .icon-collapse { display: block; }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 80px;
      padding: 20px;
      min-height: 0;
    }

    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: 80px;
      color: #7fd77f;
      font-variant-numeric: tabular-nums;
      letter-spacing: 6px;
      font-family: 'Courier New', monospace;
      background: #142414;
      padding: 25px 45px;
      border: 2px solid #2e5e2e;
      border-radius: 8px;
      min-width: 380px;
      text-align: center;
    }

    .clock-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: #f0f0e8;
      border-radius: 50%;
      border: 10px solid #2e5e2e;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
        gap: 35px;
        overflow-y: auto;
        padding: 30px 20px;
      }
      .timer-display {
        font-size: 48px;
        padding: 15px 25px;
        min-width: 0;
        letter-spacing: 3px;
      }
      canvas {
        width: 240px !important;
        height: 240px !important;
      }
      .brand-link { font-size: 14px; }
      .top-bar h2 { font-size: 12px; }
      .back-btn span { display: none; }
      .back-btn {
        padding-right: 8px;
        padding-left: 8px;
      }
      .back-btn,
      .fs-btn {
        height: 30px;
      }
      .fs-btn { width: 30px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>زمان استراحت</h2>
    <a href="https://www.programmer-msr.ir/" class="brand-link">programmer-msr.ir</a>

    <div class="actions">
      <!-- دکمه تمام‌صفحه -->
      <button type="button" class="fs-btn" id="fullscreenBtn" aria-label="تمام صفحه" title="تمام صفحه (F11)">
        <svg class="icon-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
        <svg class="icon-collapse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h3a2 2 0 0 0 2-2V3"></path>
          <path d="M21 8h-3a2 2 0 0 1-2-2V3"></path>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"></path>
          <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
        </svg>
      </button>

      <!-- دکمه بازگشت به سایت -->
      <a href="https://www.programmer-msr.ir/" class="back-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>بازگشت به سایت</span>
      </a>
    </div>
  </div>

  <div class="main-container">

    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">00:00:00</div>
    </div>

    <div class="clock-section">
      <canvas id="analogClock" width="300" height="300"></canvas>
    </div>

  </div>

  <script>
    // ===== Fullscreen management =====
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    }

    function enterFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen ||
                  el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen ||
                  el.msRequestFullscreen;
      if (req) {
        try {
          const p = req.call(el);
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
    }

    function exitFullscreen() {
      const ex = document.exitFullscreen ||
                 document.webkitExitFullscreen ||
                 document.mozCancelFullScreen ||
                 document.msExitFullscreen;
      if (ex) {
        try {
          const p = ex.call(document);
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
    }

    function toggleFullscreen() {
      if (isFullscreen()) {
        exitFullscreen();
      } else {
        enterFullscreen();
      }
    }

    // به‌روزرسانی آیکون و وضعیت دکمه
    function updateFullscreenUI() {
      const fs = isFullscreen();
      document.body.classList.toggle('fs-active', fs);
      if (fullscreenBtn) {
        fullscreenBtn.setAttribute('aria-label', fs ? 'خروج از تمام صفحه' : 'تمام صفحه');
        fullscreenBtn.setAttribute('title', fs ? 'خروج از تمام صفحه (F11)' : 'تمام صفحه (F11)');
      }
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
      .forEach(function (evt) {
        document.addEventListener(evt, updateFullscreenUI);
      });

    // کلیک روی دکمه تمام‌صفحه
    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleFullscreen();
      });
    }

    // کلید F11
    document.addEventListener('keydown', function (e) {
      if (e.key === 'F11' || e.keyCode === 122) {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // خروج از تمام‌صفحه هنگام کلیک روی «بازگشت به سایت»
    const backBtn = document.querySelector('.back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        if (isFullscreen()) exitFullscreen();
      });
    }

    // ===== Clock =====
    const canvas = document.getElementById('analogClock');
    const ctx = canvas.getContext('2d');

    const dpr = window.devicePixelRatio || 1;
    const size = 300;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.scale(dpr, dpr);

    const radius = size / 2;
    ctx.translate(radius, radius);

    const tehranFormatter = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Tehran',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hourCycle: 'h23'
    });

    function getTehranTime() {
      const parts = tehranFormatter.formatToParts(new Date());
      const map = {};
      parts.forEach(p => map[p.type] = p.value);
      return {
        hr: parseInt(map.hour, 10),
        min: parseInt(map.minute, 10),
        sec: parseInt(map.second, 10)
      };
    }

    function drawClock() {
      const t = getTehranTime();
      const ms = Date.now() % 1000;
      const secWithMs = t.sec + ms / 1000;

      ctx.clearRect(-radius, -radius, size, size);

      ctx.beginPath();
      ctx.arc(0, 0, radius - 22, 0, Math.PI * 2);
      ctx.fillStyle = '#f0f0e8';
      ctx.fill();

      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * Math.PI / 180;
        const isHour = i % 5 === 0;
        const start = isHour ? radius - 35 : radius - 28;
        const end = radius - 22;

        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * start, Math.sin(angle) * start);
        ctx.lineTo(Math.cos(angle) * end, Math.sin(angle) * end);
        ctx.strokeStyle = isHour ? '#1a2e1a' : '#6a8a6a';
        ctx.lineWidth = isHour ? 3 : 1;
        ctx.stroke();
      }

      ctx.font = 'bold 20px Vazirmatn, serif';
      ctx.fillStyle = '#1a2e1a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const persianNums = ['۱۲','۱','۲','۳','۴','۵','۶','۷','۸','۹','۱۰','۱۱'];
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const r = radius - 52;
        ctx.fillText(persianNums[i], Math.cos(angle) * r, Math.sin(angle) * r);
      }

      const hrAngle = ((t.hr % 12) * 30 + t.min * 0.5 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(hrAngle) * (radius * 0.5), Math.sin(hrAngle) * (radius * 0.5));
      ctx.strokeStyle = '#1a2e1a';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.stroke();

      const minAngle = (t.min * 6 + t.sec * 0.1 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(minAngle) * (radius * 0.7), Math.sin(minAngle) * (radius * 0.7));
      ctx.strokeStyle = '#1a2e1a';
      ctx.lineWidth = 5;
      ctx.stroke();

      const secAngle = (secWithMs * 6 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(secAngle) * (radius * 0.78), Math.sin(secAngle) * (radius * 0.78));
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#1a2e1a';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#c0392b';
      ctx.fill();

      requestAnimationFrame(drawClock);
    }

    requestAnimationFrame(drawClock);

    // ===== Timer =====
    const timerDisplay = document.getElementById('timerDisplay');
    let counterInterval = null;
    let secondsElapsed = 0;

    function formatTime(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const pad = n => String(n).padStart(2, '0');
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function startCounter() {
      clearInterval(counterInterval);
      counterInterval = setInterval(() => {
        secondsElapsed++;
        timerDisplay.textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    timerDisplay.textContent = formatTime(0);
    startCounter();
  </script>
</body>
</html>
