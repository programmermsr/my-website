    header {
      text-align: center;

      align-items: center;
    }

    h1 {
      margin: 0 0 6px;

      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4facfe 0%, #a78bfa 60%, #f093fb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .instruction {

      font-weight: 500;
    }

    /* Simple Note below the instruction */
    .map-note {
      margin-top: 8px;

    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #map-container {

      border-radius: 22px;

      animation: fadeUp 0.8s ease 0.1s both;
      transition: border-radius 0.3s ease;
    }

    #map-container:fullscreen,
    #map-container:-webkit-full-screen,
    #map-container:-moz-full-screen {
      border-radius: 0;
      box-shadow: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    #map {
      width: 100%;
      height: 100%;
      direction: ltr;
      background: #0a0e27;
    }

    #distance-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: rgba(10, 14, 39, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(79, 172, 254, 0.35);
      border-radius: 18px;
      padding: 14px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(79, 172, 254, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 800;
    }

    #distance-card.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .card-label {
      font-size: 0.78em;
      color: #8b9dc3;
      font-weight: 600;
      letter-spacing: 2px;
    }

    #distance-value {
      font-size: 1.9em;

      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4facfe 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    #reset-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(10, 14, 39, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(79, 172, 254, 0.35);
      color: #4facfe;
      padding: 10px 16px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.88em;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(-12px) scale(0.9);
      pointer-events: none;
      z-index: 800;
    }

    #reset-btn.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #reset-btn:hover {
      background: rgba(79, 172, 254, 0.18);
      box-shadow: 0 0 24px rgba(79, 172, 254, 0.45);
      transform: translateY(-2px) scale(1);
    }

    #reset-btn:active {
      transform: translateY(0) scale(0.96);
    }

    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .marker-pin {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex !important;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      border: 3px solid #fff;
      font-family: Vazirmatn, 'Segoe UI', sans-serif;
      line-height: 1;
      box-sizing: border-box;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }

    .marker-a {

    }

    .marker-b {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);

    .leaflet-control-attribution a { color: #7a8aaa !important; }

    @media (max-width: 600px) {
      body { padding: 12px; gap: 10px; }

      .map-note { font-size: 0.7em; margin-top: 6px; }
      .action-btn { padding: 8px 12px; font-size: 0.78em; }
      #distance-card { padding: 10px 24px; bottom: 16px; }
      #distance-value { font-size: 1.5em; }
      #reset-btn { padding: 8px 12px; font-size: 0.8em; top: 12px; right: 12px; }
    }

  <header>
    <h1>فاصله خطی بین دو نقطه</h1>
    <p class="instruction">دو نقطه در نقشه انتخاب کنید تا فاصله ی خطی نمایش داده شود</p>
    
    <!-- Simple text note -->
    <p class="map-note">اگر نقشه نمایش داده نمی‌شود، از تحریم‌شکن (VPN) استفاده کنید.</p>
  </header>

  <main id="map-container">
    <div id="map"></div>

    <div id="distance-card">
      <span class="card-label">فاصله خطی</span>
      <span id="distance-value">--</span>
    </div>

    <button id="reset-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      شروع مجدد
    </button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    if (typeof L === 'undefined') {
      document.body.innerHTML +=
        '<p style="color:#f5576c;text-align:center">⚠️ کتابخانه Leaflet بارگذاری نشد. اتصال اینترنت را بررسی کنید یا از VPN استفاده کنید.</p>';
      throw new Error('Leaflet not loaded');
    }

    let clickCount = 0;
    let markers = [];
    let line = null;
    let halo = null;

    const distanceCard  = document.getElementById('distance-card');
    const distanceValue = document.getElementById('distance-value');
    const resetBtn      = document.getElementById('reset-btn');
    const mapContainer  = document.getElementById('map-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    const MAX_ZOOM        = 20;
    const MAX_NATIVE_ZOOM = 20;

    const map = L.map('map', {
      center: [35.6892, 51.3890],
      zoom: 6,
      zoomControl: true,
      minZoom: 3,
      maxZoom: MAX_ZOOM
    });

    // Google Maps Hybrid Layer (Satellite + Labels in Persian)
    L.tileLayer(
      'https://{s}.google.com/vt/lyrs=y&hl=fa&x={x}&y={y}&z={z}',
      {
        maxZoom: MAX_ZOOM,
        maxNativeZoom: MAX_NATIVE_ZOOM,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '© Google Maps'
      }
    ).addTo(map);

    function getFullscreenElement() {
      return document.fullscreenElement ||
             document.webkitFullscreenElement ||
             document.mozFullScreenElement ||
             document.msFullscreenElement;
    }

    function enterFullscreen(el) {
      if (el.requestFullscreen)            return el.requestFullscreen();
      if (el.webkitRequestFullscreen)      return el.webkitRequestFullscreen();
      if (el.mozRequestFullScreen)         return el.mozRequestFullScreen();
      if (el.msRequestFullscreen)          return el.msRequestFullscreen();
    }

    function exitFullscreen() {
      if (document.exitFullscreen)         return document.exitFullscreen();
      if (document.webkitExitFullscreen)   return document.webkitExitFullscreen();
      if (document.mozCancelFullScreen)    return document.mozCancelFullScreen();
      if (document.msExitFullscreen)       return document.msExitFullscreen();
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!getFullscreenElement()) {
        enterFullscreen(mapContainer).catch(err => console.error(err));
      } else {
        exitFullscreen();
      }
    });

    ['fullscreenchange', 'webkitfullscreenchange',
     'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => {
        setTimeout(() => map.invalidateSize(), 150);
      });
    });

    // Map Click Event
    map.on('click', (e) => {
      
      // If two points already exist (A and B), remove the old B and the connecting line
      if (clickCount === 2) {
        map.removeLayer(markers[1]); // Remove old B marker
        markers.pop();               // Remove old B from array

        if (line) { map.removeLayer(line); line = null; }
        if (halo) { map.removeLayer(halo); halo = null; }

        clickCount = 1; // Now we only have A
      }

      // Determine if this is A or B
      const isFirst  = clickCount === 0;
      const label    = isFirst ? 'A' : 'B';
      const pinClass = isFirst ? 'marker-a' : 'marker-b';

      const icon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-pin ${pinClass}">${label}</div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17]
      });

      // Add the new marker
      const marker = L.marker(e.latlng, { icon }).addTo(map);
      markers.push(marker);
      clickCount++;

      // If we now have two points, draw the line and show distance
      if (clickCount === 2) {
        drawLine();
        showDistance();
      }
    });

    function drawLine() {
      if (markers.length < 2) return;

      const p1 = markers[0].getLatLng();
      const p2 = markers[1].getLatLng();

      halo = L.polyline([p1, p2], {
        color: '#ffffff',
        weight: 8,
        opacity: 0.85
      }).addTo(map);

      line = L.polyline([p1, p2], {
        color: '#4facfe',
        weight: 4,
        opacity: 1,
        dashArray: '12, 8'
      }).addTo(map);
    }

    function showDistance() {
      if (markers.length < 2) return;

      const meters = markers[0].getLatLng().distanceTo(markers[1].getLatLng());
      const text = meters >= 1000
        ? (meters / 1000).toFixed(2) + ' کیلومتر'
        : meters.toFixed(0) + ' متر';

      distanceValue.textContent = text;
      distanceCard.classList.add('show');
      resetBtn.classList.add('show');
    }

    // Reset Button Logic
    resetBtn.addEventListener('click', () => {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (line) { map.removeLayer(line); line = null; }
      if (halo) { map.removeLayer(halo); halo = null; }

      clickCount = 0;
      distanceValue.textContent = '--';
      distanceCard.classList.remove('show');
      resetBtn.classList.remove('show'); // Hide reset button after reset
    });
  </script>
</body>
