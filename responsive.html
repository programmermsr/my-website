<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابزار نمایش ریسپانسیو | محمد صادق رضائی</title>
  <meta name="description" content="ابزار آنلاین تست ریسپانسیو سایت در دستگاه‌های مختلف (گوشی، تبلت، لپ‌تاپ و تلویزیون)">
  
  <!-- Vazirmatn Font -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  
  <!-- Favicon -->
  <link rel="icon" href="homeImages/head/msrMedium.jpg" type="image/jpeg">

  <style>
    /* Global Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      user-select: none;
    }

    body {
      background-color: #05070a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(176, 0, 255, 0.05) 0%, transparent 50%);
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(10, 14, 27, 0.8);
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .back-btn {
      color: #00e5ff;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid #00e5ff;
      padding: 6px 14px;
      border-radius: 8px;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
    }

    /* Toolbar (URL & Device Selector) */
    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: rgba(10, 14, 27, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-wrap: wrap;
    }

    /* URL Input Box */
    .url-input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #151b2b;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      padding: 5px 10px 5px 15px;
      width: 100%;
      max-width: 500px;
      transition: 0.3s;
    }

    .url-input-box:focus-within {
      border-color: #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    .url-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      direction: ltr; /* برای تایپ صحیح لینک انگلیسی */
      min-width: 0;
    }

    /* استایل متن راهنما (Placeholder) */
    .url-input-box input::placeholder {
      color: #888; /* رنگ خاکستری */
      direction: rtl; /* برای نمایش صحیح متن فارسی */
      text-align: right;
    }

    .url-input-box button {
      background: #00e5ff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      white-space: nowrap;
    }

    .url-input-box button:hover {
      background: #00ffcc;
      box-shadow: 0 0 10px #00e5ff;
    }

    .device-selectors {
      display: flex;
      gap: 10px;
      background: #151b2b;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .device-btn {
      background: transparent;
      color: #888;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .device-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .device-btn:hover {
      color: #fff;
    }

    .device-btn.active {
      background: rgba(0, 229, 255, 0.15);
      color: #00e5ff;
      box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.5);
    }

    /* Workspace Area */
    .workspace {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Grid background */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Device Wrapper for Scaling */
    .device-scale-wrapper {
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center center;
    }

    /* Device Frame */
    .device-frame {
      background: #000;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Mobile/Tablet specific styling (Bezels) */
    .device-frame.mobile,
    .device-frame.tablet {
      border-radius: 35px;
      border: 12px solid #1a1a1a;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.2),
        inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Notch for Mobile */
    .device-frame.mobile::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 25px;
      background: #1a1a1a;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      z-index: 10;
    }

    /* Laptop/TV specific styling */
    .device-frame.laptop,
    .device-frame.tv {
      border-radius: 12px;
      border: 3px solid #2a2a2a;
    }

    /* Browser Header Bar for Laptop/TV */
    .browser-header {
      height: 30px;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 8px;
    }

    .browser-header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .browser-header .dot.red { background: #ff5f56; }
    .browser-header .dot.yellow { background: #ffbd2e; }
    .browser-header .dot.green { background: #27c93f; }

    /* IFrame */
    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* Info Overlay */
    .info-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(10, 14, 27, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 12px;
      color: #00e5ff;
      pointer-events: none;
      z-index: 10;
    }

    /* Mobile Responsive for the Tool itself */
    @media (max-width: 600px) {
      .toolbar {
        flex-direction: column;
        gap: 10px;
      }
      .device-selectors {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }
      .device-btn {
        flex: 1;
        justify-content: center;
        padding: 8px;
      }
      .device-btn span { display: none; }
      .device-btn svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <h2 style="color:#00e5ff; font-size:16px;">ابزار تست ریسپانسیو</h2>
    <a href="https://www.programmer-msr.ir/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      بازگشت به سایت
    </a>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="url-input-box">
      <!-- مقدار value حذف شد و متن placeholder تغییر کرد -->
      <input type="text" id="urlInput" placeholder="لطفا لینک را وارد کنید" dir="ltr">
      <button id="loadBtn">بارگذاری</button>
    </div>

    <div class="device-selectors">
      <button class="device-btn active" data-device="mobile" title="گوشی موبایل">
        <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
        <span>گوشی</span>
      </button>
      <button class="device-btn" data-device="tablet" title="تبلت">
        <svg viewBox="0 0 24 24"><path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM21 18H3V6h18v12z"/></svg>
        <span>تبلت</span>
      </button>
      <button class="device-btn" data-device="laptop" title="لپ‌تاپ">
        <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        <span>لپ‌تاپ</span>
      </button>
      <button class="device-btn" data-device="tv" title="تلویزیون">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <span>تلویزیون</span>
      </button>
    </div>
  </div>

  <!-- Workspace -->
  <div class="workspace" id="workspace">
    
    <div class="info-overlay" id="dimensionInfo">375 × 667</div>

    <!-- Device Wrapper (Used for scaling down large devices) -->
    <div class="device-scale-wrapper" id="scaleWrapper">
      
      <!-- The Actual Device -->
      <div class="device-frame mobile" id="deviceFrame">
        
        <!-- Browser header (Hidden on mobile) -->
        <div class="browser-header" id="browserHeader" style="display:none;">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>

        <!-- The Website Iframe (Still shows your site by default) -->
        <iframe id="previewFrame" src="https://www.programmer-msr.ir/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      
      </div>
    </div>

  </div>

  <script>
    // Device configurations
    const DEVICES = {
      mobile:  { width: 375,  height: 667,  class: 'mobile' },
      tablet:  { width: 768,  height: 1024, class: 'tablet' },
      laptop:  { width: 1366, height: 768,  class: 'laptop' },
      tv:      { width: 1920, height: 1080, class: 'tv' }
    };

    let currentDevice = 'mobile';

    const workspace = document.getElementById('workspace');
    const scaleWrapper = document.getElementById('scaleWrapper');
    const deviceFrame = document.getElementById('deviceFrame');
    const browserHeader = document.getElementById('browserHeader');
    const dimensionInfo = document.getElementById('dimensionInfo');
    const urlInput = document.getElementById('urlInput');
    const loadBtn = document.getElementById('loadBtn');
    const previewFrame = document.getElementById('previewFrame');
    const deviceBtns = document.querySelectorAll('.device-btn');

    // Function to update iframe size and scale
    function updateDevice(deviceKey) {
      currentDevice = deviceKey;
      const config = DEVICES[deviceKey];

      // Update UI active state
      deviceBtns.forEach(btn => {
        if (btn.dataset.device === deviceKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Update Frame Dimensions and Class
      deviceFrame.style.width = config.width + 'px';
      deviceFrame.style.height = config.height + 'px';
      
      // Reset classes
      deviceFrame.className = 'device-frame ' + config.class;

      // Show/Hide Browser Header for Laptop/TV
      if (deviceKey === 'laptop' || deviceKey === 'tv') {
        browserHeader.style.display = 'flex';
      } else {
        browserHeader.style.display = 'none';
      }

      // Update dimensions text
      dimensionInfo.textContent = `${config.width} × ${config.height}`;

      // Calculate Scale to fit inside workspace
      const padding = 40; // Space around the device
      const availableWidth = workspace.clientWidth - padding;
      const availableHeight = workspace.clientHeight - padding;

      const scaleX = availableWidth / config.width;
      const scaleY = availableHeight / config.height;
      
      // If device is larger than the screen, scale it down
      let scale = 1;
      if (scaleX < 1 || scaleY < 1) {
        scale = Math.min(scaleX, scaleY);
      }

      // Apply transform to wrapper
      scaleWrapper.style.transform = `scale(${scale})`;
    }

    // Event Listeners for Device Buttons
    deviceBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        updateDevice(btn.dataset.device);
      });
    });

    // Load URL logic
    function loadUrl() {
      let url = urlInput.value.trim();
      if (url) {
        // Add https:// if missing
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
          urlInput.value = url;
        }
        previewFrame.src = url;
      }
    }

    loadBtn.addEventListener('click', loadUrl);
    urlInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loadUrl();
    });

    // Handle window resize (re-calculate scale)
    window.addEventListener('resize', () => {
      updateDevice(currentDevice);
    });

    // Initialize on load
    window.addEventListener('load', () => {
      updateDevice('mobile');
    });
  </script>
</body>
</html>
