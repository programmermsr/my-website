  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Vazirmatn, 'Segoe UI', Tahoma, sans-serif;
      background:
        radial-gradient(ellipse at 50% 25%, rgba(45, 45, 52, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 85%, rgba(30, 30, 38, 0.4) 0%, transparent 60%),
        #0e0e12;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 24px;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: fadeDown 0.6s ease both;
    }

    .top-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.88em;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(240, 240, 232, 0.15);
      background: rgba(20, 20, 26, 0.6);
      color: #d0d0d8;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .top-btn:hover {
      background: rgba(240, 240, 232, 0.08);
      transform: translateY(-2px);
    }

    .top-btn:active {
      transform: translateY(0) scale(0.96);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
      animation: fadeUp 0.8s ease 0.1s both;
      padding: 6px;
    }

    main:fullscreen,
    main:-webkit-full-screen,
    main:-moz-full-screen {
      background:
        radial-gradient(ellipse at 50% 25%, rgba(45, 45, 52, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 85%, rgba(30, 30, 38, 0.4) 0%, transparent 60%),
        #0e0e12;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 900;
      letter-spacing: 4px;
      color: #f0f0e8;
      text-shadow:
        0 0 2px rgba(240, 240, 232, 0.6),
        0 0 30px rgba(240, 240, 232, 0.15);
    }

    #new-round {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 255, 100, 0.35);
      background: rgba(20, 20, 26, 0.8);
      color: #00ff64;
      text-shadow: 0 0 12px rgba(0, 255, 100, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #new-round:hover {
      background: rgba(0, 255, 100, 0.15);
      box-shadow: 0 0 22px rgba(0, 255, 100, 0.4);
      transform: translateY(-2px);
    }

    #new-round:active {
      transform: translateY(0) scale(0.96);
    }

    .scores {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .score-card {
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95em;
      background: rgba(240, 240, 232, 0.03);
      border: 1px solid rgba(240, 240, 232, 0.08);
      min-width: 90px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .score-card.x {
      color: #ff5555;
      border-color: rgba(255, 85, 85, 0.3);
      text-shadow: 0 0 12px rgba(255, 85, 85, 0.5);
    }

    .score-card.o {
      color: #4fc3f7;
      border-color: rgba(79, 195, 247, 0.3);
      text-shadow: 0 0 12px rgba(79, 195, 247, 0.5);
    }

    .score-card.draw {
      color: #8b9dc3;
    }

    .score-card span {
      display: inline-block;
      min-width: 22px;
      font-variant-numeric: tabular-nums;
    }

    .status {
      font-size: 1.2em;
      font-weight: 700;
      margin-bottom: 24px;
      color: #d0d0d8;
      min-height: 1.6em;
      text-align: center;
      transition: all 0.3s ease;
    }

    .status .x-mark {
      color: #ff5555;
      text-shadow: 0 0 15px rgba(255, 85, 85, 0.8);
    }

    .status .o-mark {
      color: #4fc3f7;
      text-shadow: 0 0 15px rgba(79, 195, 247, 0.8);
    }

    .status .win-mark {
      color: #00ff64;
      text-shadow: 0 0 20px rgba(0, 255, 100, 0.9);
    }

    .board {
      position: relative;
      width: min(85vw, 420px, 48vh);
      aspect-ratio: 1;
      user-select: none;
    }

    .board.locked {
      pointer-events: none;
    }

    .chalk-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      overflow: visible;
    }

    .grid-lines line {
      opacity: 0.92;
    }

    .marks > g {
      animation: markFade 0.35s ease-out both;
    }

    .marks > g.win-mark {
      animation: markFade 0.35s ease-out both, winPulse 0.9s ease-in-out infinite;
    }

    @keyframes markFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes winPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }

    .cell-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      direction: ltr;
    }

    .cell {
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s ease;
      padding: 0;
      margin: 0;
      font: inherit;
    }

    .cell:hover:not(:disabled) {
      background: radial-gradient(circle, rgba(240, 240, 232, 0.08) 0%, transparent 70%);
    }

    .cell:focus-visible {
      outline: none;
      background: radial-gradient(circle, rgba(79, 195, 247, 0.15) 0%, transparent 70%);
    }

    .cell:disabled {
      cursor: default;
    }

    @media (max-width: 600px) {
      body { padding: 14px 12px 14px; gap: 10px; }
      h1 { font-size: 1.3em; letter-spacing: 3px; }
      .top-btn { padding: 8px 10px; font-size: 0.76em; gap: 5px; }
      .top-btn svg { width: 12px; height: 12px; }
      .title-row { gap: 14px; margin-bottom: 14px; }
      #new-round { padding: 7px 12px; font-size: 0.78em; }
      .scores { margin-bottom: 16px; }
      .status { font-size: 1em; margin-bottom: 16px; }
      .score-card { padding: 8px 14px; font-size: 0.85em; min-width: 78px; }
    }

    @media (max-width: 400px) {
      .top-btn span { display: none; }
      .top-btn { padding: 10px; }
      #new-round span { display: none; }
      #new-round { padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">

    <button id="fullscreen-btn" class="top-btn" title="حالت تمام صفحه">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
      <span>تمام صفحه</span>
    </button>

    <a href="https://www.programmer-msr.ir/" class="top-btn" title="بازگشت به سایت اصلی">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>بازگشت به سایت</span>
    </a>

  </div>

  <main id="main-area">

    <div class="title-row">
      <h1>دوز</h1>
      <button id="new-round" title="شروع مجدد">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>دور جدید</span>
      </button>
    </div>

    <div class="scores">
      <div class="score-card x">✕ <span id="score-x">0</span></div>
      <div class="score-card draw">مساوی <span id="score-draw">0</span></div>
      <div class="score-card o">◯ <span id="score-o">0</span></div>
    </div>

    <div class="status" id="status">
      نوبت <span class="x-mark">✕</span>
    </div>

    <div class="board" id="board-wrap">
      <svg class="chalk-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="chalk" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="wobble"/>
            <feDisplacementMap in="SourceGraphic" in2="wobble" scale="4" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="rough"/>
            <feDisplacementMap in="displaced" in2="rough" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
          </filter>

          <filter id="chalk-win" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="wobble"/>
            <feDisplacementMap in="SourceGraphic" in2="wobble" scale="4" result="displaced"/>
            <feGaussianBlur in="displaced" stdDeviation="4" result="glow"/>
            <feMerge>
              <feMergeNode in="glow"/>
              <feMergeNode in="glow"/>
              <feMergeNode in="displaced"/>
            </feMerge>
          </filter>
        </defs>

        <g class="grid-lines" filter="url(#chalk)"
           stroke="#f0f0e8" stroke-width="4.5"
           stroke-linecap="round" fill="none">
          <line x1="99"  y1="8"   x2="101" y2="292"/>
          <line x1="201" y1="10"  x2="199" y2="290"/>
          <line x1="8"   y1="101" x2="292" y2="99"/>
          <line x1="10"  y1="199" x2="290" y2="201"/>
        </g>

        <g class="marks" id="marks-group"></g>
      </svg>

      <div class="cell-grid" id="cell-grid"></div>
    </div>
  </main>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const boardWrap = document.getElementById('board-wrap');
    const cellGrid = document.getElementById('cell-grid');
    const marksGroup = document.getElementById('marks-group');
    const statusEl = document.getElementById('status');
    const scoreXEl = document.getElementById('score-x');
    const scoreOEl = document.getElementById('score-o');
    const scoreDrawEl = document.getElementById('score-draw');
    const newRoundBtn = document.getElementById('new-round');
    const mainEl = document.getElementById('main-area');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    const WIN_PATTERNS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const COLOR_X = '#ff5555';
    const COLOR_O = '#4fc3f7';
    const COLOR_WIN = '#00ff64';

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };
    const markElements = {};

    function jitter(amount) {
      return (Math.random() - 0.5) * amount;
    }

    function buildCellGrid() {
      cellGrid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'cell';
        btn.dataset.i = i;
        btn.type = 'button';
        btn.setAttribute('aria-label', 'خانه ' + (i + 1));
        btn.addEventListener('click', () => handleClick(i));
        cellGrid.appendChild(btn);
      }
    }

    function drawMark(idx, player) {
      const col = idx % 3;
      const row = Math.floor(idx / 3);
      const cx = col * 100 + 50;
      const cy = row * 100 + 50;

      const g = document.createElementNS(NS, 'g');
      g.setAttribute('filter', 'url(#chalk)');
      g.setAttribute('stroke-linecap', 'round');
      g.setAttribute('stroke-linejoin', 'round');
      g.setAttribute('fill', 'none');

      if (player === 'X') {
        const s = 26;
        g.setAttribute('stroke', COLOR_X);
        g.setAttribute('stroke-width', '7');

        const l1 = document.createElementNS(NS, 'line');
        l1.setAttribute('x1', cx - s + jitter(6));
        l1.setAttribute('y1', cy - s + jitter(6));
        l1.setAttribute('x2', cx + s + jitter(6));
        l1.setAttribute('y2', cy + s + jitter(6));
        g.appendChild(l1);

        const l2 = document.createElementNS(NS, 'line');
        l2.setAttribute('x1', cx + s + jitter(6));
        l2.setAttribute('y1', cy - s + jitter(6));
        l2.setAttribute('x2', cx - s + jitter(6));
        l2.setAttribute('y2', cy + s + jitter(6));
        g.appendChild(l2);

      } else {
        g.setAttribute('stroke', COLOR_O);
        g.setAttribute('stroke-width', '7');

        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', cx + jitter(3));
        c.setAttribute('cy', cy + jitter(3));
        c.setAttribute('r', 27);
        g.appendChild(c);
      }

      marksGroup.appendChild(g);
      markElements[idx] = g;
    }

    function highlightWin(indices) {
      indices.forEach(i => {
        const g = markElements[i];
        if (!g) return;
        g.setAttribute('filter', 'url(#chalk-win)');
        g.querySelectorAll('line, circle').forEach(el => {
          el.setAttribute('stroke', COLOR_WIN);
        });
        g.classList.add('win-mark');
      });
    }

    function handleClick(idx) {
      if (gameOver || board[idx] !== '') return;

      board[idx] = currentPlayer;
      drawMark(idx, currentPlayer);

      const btn = cellGrid.children[idx];
      btn.disabled = true;
      btn.setAttribute('aria-label', currentPlayer === 'X' ? 'ضربدر' : 'دایره');

      const winLine = findWinLine(currentPlayer);
      if (winLine) {
        gameOver = true;
        boardWrap.classList.add('locked');
        highlightWin(winLine);
        scores[currentPlayer]++;
        updateScores();
        const cls = currentPlayer === 'X' ? 'x-mark' : 'o-mark';
        const symbol = currentPlayer === 'X' ? '✕' : '◯';
        statusEl.innerHTML = `🏆 برنده: <span class="${cls}">${symbol}</span>`;
        return;
      }

      if (board.every(c => c !== '')) {
        gameOver = true;
        boardWrap.classList.add('locked');
        scores.draw++;
        updateScores();
        statusEl.innerHTML = `🤝 <span class="win-mark">مساوی!</span>`;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();
    }

    function findWinLine(player) {
      for (const pattern of WIN_PATTERNS) {
        const [a, b, c] = pattern;
        if (board[a] === player && board[b] === player && board[c] === player) {
          return pattern;
        }
      }
      return null;
    }

    function updateStatus() {
      const cls = currentPlayer === 'X' ? 'x-mark' : 'o-mark';
      const symbol = currentPlayer === 'X' ? '✕' : '◯';
      statusEl.innerHTML = `نوبت <span class="${cls}">${symbol}</span>`;
    }

    function updateScores() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDrawEl.textContent = scores.draw;
    }

    function newRound() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      boardWrap.classList.remove('locked');

      marksGroup.innerHTML = '';
      for (const k in markElements) delete markElements[k];

      for (const btn of cellGrid.children) {
        btn.disabled = false;
        const i = parseInt(btn.dataset.i, 10);
        btn.setAttribute('aria-label', 'خانه ' + (i + 1));
      }

      updateStatus();
    }

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement ||
             document.mozFullScreenElement || document.msFullscreenElement;
    }
    function enterFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
      if (el.msRequestFullscreen) return el.msRequestFullscreen();
    }
    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!getFullscreenElement()) enterFullscreen(mainEl).catch(err => console.error(err));
      else exitFullscreen();
    });

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => {
        requestAnimationFrame(() => requestAnimationFrame(() => {}));
      });
    });

    newRoundBtn.addEventListener('click', newRound);

    buildCellGrid();
    updateStatus();
    updateScores();
  </script>
</body>
</html>
