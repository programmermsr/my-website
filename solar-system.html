      down: false,

      moved: false

      starLayer1 = [];
      starLayer2 = [];
      starLayer3 = [];

      const layers = [
        { arr: starLayer1, count: Math.floor((W * H) / 6000), maxSize: 0.8, colors: ['rgba(200, 210, 255, ', 'rgba(255, 255, 255, '] },

      ];

      for (const layer of layers) {
        for (let i = 0; i < layer.count; i++) {
          layer.arr.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * layer.maxSize + 0.3,
            color: layer.colors[Math.floor(Math.random() * layer.colors.length)],
            phase: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 2
          });
        }
      }
    }

    function createNebula() {
      nebulaCanvas = document.createElement('canvas');
      nebulaCanvas.width = W;
      nebulaCanvas.height = H;
      const nctx = nebulaCanvas.getContext('2d');

      const nebulaColors = [
        { r: 80, g: 30, b: 140 },
        { r: 30, g: 60, b: 150 },
        { r: 140, g: 30, b: 100 },
        { r: 20, g: 100, b: 120 },
        { r: 100, g: 40, b: 80 }
      ];

      const blobCount = 10 + Math.floor(W * H / 200000);

      for (let i = 0; i < blobCount; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        const r = 150 + Math.random() * 350;
        const c = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
        const alpha = 0.06 + Math.random() * 0.08;

        const grad = nctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`);
        grad.addColorStop(0.4, `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha * 0.5})`);
        grad.addColorStop(1, `rgba(${c.r}, ${c.g}, ${c.b}, 0)`);
        nctx.fillStyle = grad;
        nctx.fillRect(0, 0, W, H);
      }
    }

    function createAsteroids() {
      asteroids = [];
      const beltOrbit = 266;
      const count = 90;

      for (let i = 0; i < count; i++) {
        asteroids.push({
          angle: Math.random() * Math.PI * 2,
          orbit: beltOrbit + (Math.random() - 0.5) * 30,
          size: 0.8 + Math.random() * 1.8,
          period: 800 + Math.random() * 400,
          brightness: 0.3 + Math.random() * 0.5
        });
      }
    }

    function resize() {
      const rect = mainEl.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      labelFontSize = Math.max(11, Math.min(15, Math.min(W, H) / 50));

      createStars();
      createNebula();
      createAsteroids();
      fitToScreen();
    }

    function fitToScreen() {
      const maxOrbit = Math.max(...PLANETS.map(p => p.orbit)) + 50;
      const marginX = W < 600 ? 25 : 70;
      const marginY = H < 600 ? 25 : 70;
      const availW = W - marginX * 2;
      const availH = H - marginY * 2;

      const scaleW = availW / (maxOrbit * 2);
      const scaleH = availH / (maxOrbit * 2 * TILT);

      scale = Math.min(scaleW, scaleH);
      offsetX = 0;
      offsetY = 0;
    }

    function updatePlanetPositions() {
      for (const p of PLANETS) {
        const angle = (simTime / p.period) * Math.PI * 2 + p.angle;
        p.angleNow = angle;
        p.x = Math.cos(angle) * p.orbit;
        p.y = Math.sin(angle) * p.orbit * TILT;
        p.z = Math.sin(angle);
        p.depthScale = 0.85 + (p.z + 1) * 0.15;

        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 30) p.trail.shift();
      }
    }

    function worldToScreen(wx, wy) {
      return {
        x: wx * scale + W / 2 + offsetX,
        y: wy * scale + H / 2 + offsetY
      };
    }

    function drawBackground() {
      ctx.fillStyle = '#02020a';
      ctx.fillRect(0, 0, W, H);

      if (nebulaCanvas) {
        ctx.globalAlpha = 0.9;
        ctx.drawImage(nebulaCanvas, 0, 0);
        ctx.globalAlpha = 1;
      }
    }

    function drawStars() {
      const t = performance.now() * 0.001;
      const allLayers = [starLayer1, starLayer2, starLayer3];

      for (let li = 0; li < allLayers.length; li++) {
        const layer = allLayers[li];
        for (const s of layer) {
          const alpha = 0.3 + Math.abs(Math.sin(t * s.speed + s.phase)) * 0.7;
          ctx.fillStyle = s.color + alpha + ')';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();

          if (li === 2 && s.size > 1.8) {
            ctx.fillStyle = s.color + (alpha * 0.3) + ')';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }

    function drawOrbits() {
      for (const p of PLANETS) {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.orbit, p.orbit * TILT, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 150, 220, 0.12)';
        ctx.lineWidth = 1.2 / scale;
        ctx.stroke();
      }
    }

    function drawAsteroids(back) {
      for (const a of asteroids) {
        const angle = (simTime / a.period) * Math.PI * 2 + a.angle;
        const x = Math.cos(angle) * a.orbit;
        const y = Math.sin(angle) * a.orbit * TILT;
        const z = Math.sin(angle);

        if (back && z >= 0) continue;
        if (!back && z < 0) continue;

        const ds = 0.85 + (z + 1) * 0.15;
        ctx.fillStyle = `rgba(180, 170, 150, ${a.brightness * ds})`;
        ctx.beginPath();
        ctx.arc(x, y, a.size * ds, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSun() {
      const time = performance.now() * 0.001;
      const pulse = 1 + Math.sin(time * 2) * 0.04;
      const sunR = 38;

      const outerGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 320 * pulse);
      outerGlow.addColorStop(0, 'rgba(255, 200, 80, 0.35)');
      outerGlow.addColorStop(0.2, 'rgba(255, 160, 60, 0.18)');
      outerGlow.addColorStop(0.5, 'rgba(255, 120, 40, 0.06)');
      outerGlow.addColorStop(1, 'rgba(255, 80, 20, 0)');
      ctx.fillStyle = outerGlow;
      ctx.beginPath();
      ctx.arc(0, 0, 320 * pulse, 0, Math.PI * 2);
      ctx.fill();

      const midGlow = ctx.createRadialGradient(0, 0, sunR * 0.7, 0, 0, sunR * 2.5);
      midGlow.addColorStop(0, 'rgba(255, 240, 150, 0.6)');
      midGlow.addColorStop(0.5, 'rgba(255, 180, 60, 0.2)');
      midGlow.addColorStop(1, 'rgba(255, 120, 30, 0)');
      ctx.fillStyle = midGlow;
      ctx.beginPath();
      ctx.arc(0, 0, sunR * 2.5, 0, Math.PI * 2);
      ctx.fill();

      const sunGrad = ctx.createRadialGradient(-12, -12, 5, 0, 0, sunR);
      sunGrad.addColorStop(0, '#fffceb');
      sunGrad.addColorStop(0.25, '#ffe066');
      sunGrad.addColorStop(0.6, '#ff9922');
      sunGrad.addColorStop(1, '#ff5500');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(0, 0, sunR, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, sunR, 0, Math.PI * 2);
      ctx.clip();

      for (let i = 0; i < 6; i++) {
        const ang = time * 0.3 + i * 1.2;
        const dist = sunR * (0.3 + Math.sin(time + i) * 0.2);
        const sx = Math.cos(ang) * dist;
        const sy = Math.sin(ang) * dist;
        const r = 5 + Math.sin(time * 2 + i) * 2;
        const hot = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
        hot.addColorStop(0, 'rgba(255, 255, 240, 0.5)');
        hot.addColorStop(1, 'rgba(255, 240, 150, 0)');
        ctx.fillStyle = hot;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      const coreGrad = ctx.createRadialGradient(-8, -8, 0, -8, -8, sunR * 0.6);
      coreGrad.addColorStop(0, 'rgba(255, 255, 250, 0.95)');
      coreGrad.addColorStop(1, 'rgba(255, 255, 250, 0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(-8, -8, sunR * 0.6, 0, Math.PI * 2);
      ctx.fill();

      if (sunSelected) {
        ctx.beginPath();
        ctx.arc(0, 0, sunR + 8 / scale + Math.sin(time * 3) * 2 / scale, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.85)';
        ctx.lineWidth = 1.5 / scale;
        ctx.stroke();
      }
    }

    let sunSelected = false;

    function drawPlanetBody(p, size) {
      const sunDirX = -p.x;
      const sunDirY = -p.y;
      const sunDist = Math.hypot(sunDirX, sunDirY) || 1;
      const nx = sunDirX / sunDist;
      const ny = sunDirY / sunDist;

      const brightX = p.x + nx * size * 0.5;
      const brightY = p.y + ny * size * 0.5;

      const grad = ctx.createRadialGradient(
        brightX, brightY, size * 0.05,
        p.x, p.y, size * 1.05
      );
      grad.addColorStop(0, p.colorLight || p.color);
      grad.addColorStop(0.45, p.color);
      grad.addColorStop(0.85, p.colorDark);
      grad.addColorStop(1, p.colorShadow || '#000');

      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function drawPlanetDetails(p, size) {
      if (p.key === 'jupiter') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.clip();

        const bandOffset = (simTime * 0.02) % (size * 2);

        for (let i = 0; i < 6; i++) {
          const y = p.y - size + ((i * size * 0.35 + bandOffset) % (size * 2));
          ctx.fillStyle = i % 2 === 0 ? 'rgba(120, 80, 40, 0.35)' : 'rgba(200, 160, 110, 0.25)';
          ctx.fillRect(p.x - size, y, size * 2, size * 0.18);
        }

        const spotX = p.x + size * 0.25;
        const spotY = p.y + size * 0.12;
        const spotGrad = ctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, size * 0.32);
        spotGrad.addColorStop(0, 'rgba(200, 70, 40, 0.85)');
        spotGrad.addColorStop(0.6, 'rgba(180, 60, 30, 0.5)');
        spotGrad.addColorStop(1, 'rgba(180, 60, 30, 0)');
        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.ellipse(spotX, spotY, size * 0.32, size * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      if (p.key === 'earth') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.clip();

        const rot = (simTime * 0.005) % (Math.PI * 2);

        ctx.fillStyle = 'rgba(70, 150, 70, 0.75)';
        ctx.beginPath();
        ctx.ellipse(p.x - size * 0.3 + Math.cos(rot) * 2, p.y - size * 0.2, size * 0.38, size * 0.3, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(p.x + size * 0.35 - Math.cos(rot) * 2, p.y + size * 0.3, size * 0.28, size * 0.22, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(p.x + size * 0.15, p.y - size * 0.4, size * 0.18, size * 0.14, 0.2, 0, Math.PI * 2);
        ctx.fill();

        const cloudAlpha = 0.15 + Math.sin(simTime * 0.02) * 0.05;
        ctx.fillStyle = `rgba(255, 255, 255, ${cloudAlpha})`;
        ctx.beginPath();
        ctx.ellipse(p.x - size * 0.2, p.y + size * 0.15, size * 0.5, size * 0.15, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(p.x + size * 0.3, p.y - size * 0.25, size * 0.35, size * 0.1, -0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      if (p.key === 'mars') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y - size * 0.85, size * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y + size * 0.85, size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (p.key === 'saturn') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = 'rgba(160, 130, 80, 0.3)';
        ctx.fillRect(p.x - size, p.y - size * 0.35, size * 2, size * 0.15);
        ctx.fillRect(p.x - size, p.y + size * 0.05, size * 2, size * 0.18);
        ctx.fillRect(p.x - size, p.y + size * 0.5, size * 2, size * 0.12);
        ctx.restore();
      }
    }

    function drawAtmosphere(p, size) {
      if (!p.atmosphere) return;

      const atmo = ctx.createRadialGradient(p.x, p.y, size * 0.9, p.x, p.y, size * 1.35);
      atmo.addColorStop(0, p.atmosphere);
      atmo.addColorStop(0.6, p.atmosphere.replace(/[\d.]+\)$/, '0.05)'));
      atmo.addColorStop(1, p.atmosphere.replace(/[\d.]+\)$/, '0)'));
      ctx.fillStyle = atmo;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 1.35, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSaturnRings(p, size, front) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(-0.25);

      const startAngle = front ? 0 : Math.PI;
      const endAngle = front ? Math.PI : Math.PI * 2;

      ctx.beginPath();
      ctx.ellipse(0, 0, size * 2.2, size * 0.68, 0, startAngle, endAngle);
      ctx.strokeStyle = front
        ? 'rgba(220, 200, 150, 0.75)'
        : 'rgba(220, 200, 150, 0.5)';
      ctx.lineWidth = size * 0.22;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, 0, size * 1.78, size * 0.55, 0, startAngle, endAngle);
      ctx.strokeStyle = front
        ? 'rgba(240, 220, 170, 0.6)'
        : 'rgba(240, 220, 170, 0.35)';
      ctx.lineWidth = size * 0.1;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, 0, size * 2.45, size * 0.75, 0, startAngle, endAngle);
      ctx.strokeStyle = front
        ? 'rgba(180, 160, 120, 0.4)'
        : 'rgba(180, 160, 120, 0.25)';
      ctx.lineWidth = size * 0.06;
      ctx.stroke();

      ctx.restore();
    }

    function drawPlanet(p) {
      const ds = p.depthScale;
      const size = p.size * ds;

      if (p.atmosphere) drawAtmosphere(p, size);

      if (p.hasRing) drawSaturnRings(p, size, false);

      drawPlanetBody(p, size);
      drawPlanetDetails(p, size);

      if (p.hasRing) drawSaturnRings(p, size, true);

      if (p.hasMoon) {
        const moonAngle = (simTime / 27.3) * Math.PI * 2;
        const moonR = size + 14;
        const mx = p.x + Math.cos(moonAngle) * moonR;
        const my = p.y + Math.sin(moonAngle) * moonR * TILT;

        const glowGrad = ctx.createRadialGradient(mx, my, 0, mx, my, 6);
        glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
        glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(mx, my, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(mx, my, 3 * ds, 0, Math.PI * 2);
        ctx.fillStyle = '#e8e8e8';
        ctx.fill();
      }

      if (selectedPlanet === p) {
        const t = performance.now() * 0.003;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size + 8 / scale + Math.sin(t) * 2 / scale, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.85)';
        ctx.lineWidth = 1.5 / scale;
        ctx.setLineDash([6 / scale, 4 / scale]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function drawLabels() {
      const sunScreen = worldToScreen(0, 0);

      ctx.font = `700 ${labelFontSize}px Vazirmatn, Segoe UI, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (const p of PLANETS) {
        const screen = worldToScreen(p.x, p.y);
        const dx = screen.x - sunScreen.x;
        const dy = screen.y - sunScreen.y;
        const angle = Math.atan2(dy, dx);
        const offset = p.size * p.depthScale * scale + 20 + labelFontSize * 0.7;

        let lx = screen.x + Math.cos(angle) * offset;
        let ly = screen.y + Math.sin(angle) * offset;

        lx = Math.max(32, Math.min(W - 32, lx));
        ly = Math.max(20, Math.min(H - 20, ly));

        ctx.save();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.lineWidth = 3.5;
        ctx.lineJoin = 'round';
        ctx.strokeText(p.name, lx, ly);
        ctx.shadowBlur = 0;

        ctx.fillStyle = p.colorLight || p.color;
        ctx.fillText(p.name, lx, ly);
        ctx.restore();
      }

      const sunLy = Math.min(H - 20, sunScreen.y + 38 * scale + 32);
      ctx.save();
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
      ctx.lineWidth = 3.5;
      ctx.lineJoin = 'round';
      ctx.strokeText('خورشید', sunScreen.x, sunLy);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffdd55';
      ctx.fillText('خورشید', sunScreen.x, sunLy);
      ctx.restore();
    }

    function drawVignette() {
      const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vig.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }

    function draw() {
      drawBackground();
      drawStars();

      ctx.save();
      ctx.translate(W / 2 + offsetX, H / 2 + offsetY);
      ctx.scale(scale, scale);

      drawOrbits();

      const sorted = [...PLANETS].sort((a, b) => a.z - b.z);

      for (const p of sorted) {
        if (p.z < 0) drawPlanet(p);
      }

      drawAsteroids(true);
      drawSun();
      drawAsteroids(false);

      for (const p of sorted) {
        if (p.z >= 0) drawPlanet(p);
      }

      ctx.restore();

      drawLabels();
      drawVignette();
    }

    function loop(t) {
      requestAnimationFrame(loop);

      if (lastT === 0) lastT = t;
      const dt = Math.min((t - lastT) / 1000, 0.05);
      lastT = t;

      simTime += dt * 30 * SPEED;

      updatePlanetPositions();
      draw();
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - W / 2 - offsetX) / scale,
        y: (sy - H / 2 - offsetY) / scale
      };
    }

    function findPlanetAt(sx, sy) {
      const w = screenToWorld(sx, sy);

      if (Math.hypot(w.x, w.y) < 40) return 'sun';

      for (const p of PLANETS) {
        const hitRadius = p.size * p.depthScale + 14 / scale;
        if (Math.hypot(w.x - p.x, w.y - p.y) < hitRadius) {
          return p;
        }
      }
      return null;
    }

    function showInfo(data) {
      if (data === 'sun') data = { ...SUN_INFO, key: 'sun' };

      infoName.textContent = data.name;
      infoText.textContent = data.info;
      infoDot.style.background = data.color;
      infoDot.style.color = data.color;

      infoFacts.innerHTML = '';
      for (const f of data.facts) {
        const row = document.createElement('div');
        row.className = 'fact-row';
        row.innerHTML = `<span class="fact-label">${f.label}</span><span class="fact-value">${f.value}</span>`;
        infoFacts.appendChild(row);
      }

      infoPanel.classList.add('show');

      if (data.key !== 'sun') {
        selectedPlanet = PLANETS.find(p => p.key === data.key);
        sunSelected = false;
      } else {
        selectedPlanet = null;
        sunSelected = true;
      }
    }

    function hideInfo() {
      infoPanel.classList.remove('show');
      selectedPlanet = null;
      sunSelected = false;
    }

    closeInfoBtn.addEventListener('click', hideInfo);

    function onPointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      const rect = canvas.getBoundingClientRect();
      pointer.down = true;
      pointer.moved = false;
      pointer.startX = e.clientX - rect.left;
      pointer.startY = e.clientY - rect.top;
      pointer.downOffsetX = offsetX;
      pointer.downOffsetY = offsetY;
      canvas.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (pointer.down) {
        const dx = sx - pointer.startX;
        const dy = sy - pointer.startY;
        if (Math.hypot(dx, dy) > 5) pointer.moved = true;

        if (pointer.moved) {
          offsetX = pointer.downOffsetX + dx;
          offsetY = pointer.downOffsetY + dy;
          canvas.style.cursor = 'grabbing';
        }
      } else {
        const hit = findPlanetAt(sx, sy);
        canvas.style.cursor = hit ? 'pointer' : 'grab';
      }
    }

    function onPointerUp(e) {
      if (!pointer.down) return;
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (!pointer.moved) {
        const hit = findPlanetAt(sx, sy);
        if (hit) showInfo(hit);
        else hideInfo();
      }

      pointer.down = false;
      canvas.style.cursor = 'grab';
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const worldX = (mx - W / 2 - offsetX) / scale;
      const worldY = (my - H / 2 - offsetY) / scale;

      const factor = 1 - e.deltaY * 0.0012;
      const newScale = Math.max(0.2, Math.min(6, scale * factor));

      offsetX = mx - W / 2 - worldX * newScale;
      offsetY = my - H / 2 - worldY * newScale;
      scale = newScale;
    }, { passive: false });

    document.getElementById('zoom-in').addEventListener('click', () => {
      scale = Math.min(6, scale * 1.4);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      scale = Math.max(0.2, scale / 1.4);
    });

    document.getElementById('zoom-reset').addEventListener('click', fitToScreen);

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement ||
             document.mozFullScreenElement || document.msFullscreenElement;
    }
    function enterFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
      if (el.msRequestFullscreen) return el.msRequestFullscreen();
    }
    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!getFullscreenElement()) enterFullscreen(mainEl).catch(err => console.error(err));
      else exitFullscreen();
    });

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => setTimeout(resize, 150));
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
