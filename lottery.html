  </header>

  <main id="main-area">
    <canvas id="particles"></canvas>
    <div class="flash" id="flash"></div>

    <div class="screen" id="setupScreen">
      <div class="setup-box">
        <div class="input-group">
          <label for="minInput">از</label>

          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a64dff"/>
              <stop offset="50%" stop-color="#ff3c9e"/>
              <stop offset="100%" stop-color="#ffaa00"/>
            </linearGradient>
          </defs>
          <circle cx="110" cy="110" r="95" class="ring-track"/>
          <circle cx="110" cy="110" r="95" class="ring-progress" id="ringProgress"/>
        </svg>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const mainEl = document.getElementById('main-area');
    const flash = document.getElementById('flash');

    const setupScreen = document.getElementById('setupScreen');
    const rollScreen = document.getElementById('rollScreen');
    const resultScreen = document.getElementById('resultScreen');

    const minInput = document.getElementById('minInput');
    const maxInput = document.getElementById('maxInput');
    const errorMsg = document.getElementById('errorMsg');
    const startBtn = document.getElementById('startBtn');
    const againBtn = document.getElementById('againBtn');

    const rangeInfo = document.getElementById('rangeInfo');
    const resultNumber = document.getElementById('resultNumber');
    const ringProgress = document.getElementById('ringProgress');
    const countdownNumber = document.getElementById('countdownNumber');

    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let W = 0, H = 0;
    let particles = [];
    let currentMin = 1;
    let currentMax = 100;
    let targetNumber = 0;
    let animating = false;

    const CIRCUMFERENCE = 597;

    // رنگ‌های اختصاصی هر عدد شمارش معکوس
    const COUNTDOWN_COLORS = {
      5: { main: '#a64dff', glow: '#a64dff', alt: '#6a1fd8' }, // بنفش
      4: { main: '#4facfe', glow: '#4facfe', alt: '#1f6ad8' }, // آبی
      3: { main: '#00ff64', glow: '#00ff64', alt: '#0fa840' }, // سبز
      2: { main: '#ffaa00', glow: '#ffaa00', alt: '#d87800' }, // نارنجی
      1: { main: '#ff3c3c', glow: '#ff3c3c', alt: '#c80020' }  // قرمز
    };

    const COUNTDOWN_FROM = 5;
    const STEP_DURATION = 1000;
    const COUNTDOWN_TOTAL = COUNTDOWN_FROM * STEP_DURATION;

    function toPersian(n) {
      return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function randomInRange(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function resize() {
      const rect = mainEl.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawnBurst(x, y, count, big, palette) {
      const paletteArr = palette || ['#ff3c9e', '#a64dff', '#4facfe', '#00ff64', '#ffaa00', '#ff3c3c', '#00f2fe', '#f093fb'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (big ? 6 : 3) + Math.random() * (big ? 12 : 6);
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          color: paletteArr[Math.floor(Math.random() * paletteArr.length)],
          size: (big ? 6 : 3) + Math.random() * (big ? 8 : 4),
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.3,
          life: 1,
          decay: 0.008 + Math.random() * 0.008,
          gravity: 0.18
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, W, H);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.rotation += p.rotSpeed;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        ctx.restore();
      }

      requestAnimationFrame(drawParticles);
    }

    function setCountdownDisplay(num) {
      const c = COUNTDOWN_COLORS[num];
      if (!c) return;

      countdownNumber.textContent = toPersian(num);
      countdownNumber.style.color = c.main;
      countdownNumber.style.textShadow = `
        0 0 30px ${c.glow},
        0 0 60px ${c.glow},
        0 0 90px ${c.alt}
      `;

      // رنگ حلقه پیشرفت را هم هم‌رنگ عدد می‌کنیم
      ringProgress.style.filter = `drop-shadow(0 0 14px ${c.glow})`;

      countdownNumber.classList.remove('pop');
      void countdownNumber.offsetWidth;
      countdownNumber.classList.add('pop');
    }

    function startDraw() {
      if (animating) return;

      const min = parseInt(minInput.value, 10);
      const max = parseInt(maxInput.value, 10);

      if (!Number.isFinite(min) || !Number.isFinite(max)) {
        errorMsg.textContent = 'لطفاً هر دو عدد را وارد کنید';
        return;
      }
      if (min >= max) {
        errorMsg.textContent = 'عدد دوم باید بزرگ‌تر از عدد اول باشد';
        return;
      }

      errorMsg.textContent = '';
      currentMin = min;
      currentMax = max;
      targetNumber = randomInRange(min, max);

      rangeInfo.textContent = `از ${toPersian(min)} تا ${toPersian(max)}`;

      ringProgress.style.strokeDashoffset = CIRCUMFERENCE;

      setupScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      rollScreen.classList.remove('hidden');

      animating = true;
      runCountdownAnimation();
    }

    function runCountdownAnimation() {
      rollScreen.classList.add('shaking');

      const startTime = performance.now();
      let lastShown = null;

      setCountdownDisplay(COUNTDOWN_FROM);
      lastShown = COUNTDOWN_FROM;

      const c5 = COUNTDOWN_COLORS[COUNTDOWN_FROM];
      spawnBurst(W / 2, H / 2, 15, false, [c5.main, c5.glow, '#ffffff']);

      function tick(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / COUNTDOWN_TOTAL, 1);

        if (t >= 1) {
          finishRoll();
          return;
        }

        const stepIndex = Math.floor(elapsed / STEP_DURATION);
        const currentNum = COUNTDOWN_FROM - stepIndex;

        if (currentNum !== lastShown && currentNum >= 1) {
          lastShown = currentNum;
          setCountdownDisplay(currentNum);

          const c = COUNTDOWN_COLORS[currentNum];
          const palette = [c.main, c.glow, c.alt, '#ffffff'];

          spawnBurst(W / 2, H / 2, 22 + (COUNTDOWN_FROM - currentNum) * 4, false, palette);

          for (let i = 0; i < 3; i++) {
            spawnBurst(
              W / 2 + (Math.random() - 0.5) * 260,
              H / 2 + (Math.random() - 0.5) * 200,
              5,
              false,
              palette
            );
          }
        }

        ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - t);

        const c = COUNTDOWN_COLORS[currentNum] || COUNTDOWN_COLORS[1];
        const glowBoost = 1 + t * 1.5;
        countdownNumber.style.textShadow = `
          0 0 ${30 * glowBoost}px ${c.glow},
          0 0 ${60 * glowBoost}px ${c.glow},
          0 0 ${90 * glowBoost}px ${c.alt}
        `;

        if (Math.random() < 0.3 + t * 0.5) {
          const px = W / 2 + (Math.random() - 0.5) * 350;
          const py = H / 2 + (Math.random() - 0.5) * 250;
          const palette = [c.main, c.glow, c.alt, '#ffffff'];
          spawnBurst(px, py, 2, false, palette);
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    function finishRoll() {
      rollScreen.classList.remove('shaking');
      rollScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      resultNumber.textContent = toPersian(targetNumber);

      flash.classList.add('fire');
      setTimeout(() => flash.classList.remove('fire'), 600);

      setTimeout(() => {
        const cx = W / 2;
        const cy = H / 2;
        spawnBurst(cx, cy, 100, true);
        setTimeout(() => spawnBurst(cx - 150, cy - 100, 40, true), 100);
        setTimeout(() => spawnBurst(cx + 150, cy + 100, 40, true), 200);
        setTimeout(() => spawnBurst(cx, cy - 150, 50, true), 300);

        let count = 0;
        const interval = setInterval(() => {
          if (count++ > 12) { clearInterval(interval); return; }
          if (!animating) { clearInterval(interval); return; }
          spawnBurst(
            W / 2 + (Math.random() - 0.5) * W * 0.6,
            H / 2 + (Math.random() - 0.5) * H * 0.4,
            12,
            false
          );
        }, 250);
      }, 150);

      animating = false;
    }

    function reset() {
      particles = [];
      rollScreen.classList.remove('shaking');
      rollScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
      errorMsg.textContent = '';
      animating = false;
      ringProgress.style.strokeDashoffset = CIRCUMFERENCE;
    }

    startBtn.addEventListener('click', startDraw);
    againBtn.addEventListener('click', reset);

    minInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') maxInput.focus();
    });
    maxInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') startDraw();
    });
    minInput.addEventListener('input', () => errorMsg.textContent = '');
    maxInput.addEventListener('input', () => errorMsg.textContent = '');

    function getFS() {
      return document.fullscreenElement || document.webkitFullscreenElement ||
             document.mozFullScreenElement || document.msFullscreenElement;
    }
    function enterFS(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
      if (el.msRequestFullscreen) return el.msRequestFullscreen();
    }
    function exitFS() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!getFS()) enterFS(mainEl).catch(e => console.error(e));
      else exitFS();
    });

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
      document.addEventListener(ev, () => setTimeout(resize, 150));
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });

    resize();
    drawParticles();
  </script>
</body>
</html>
